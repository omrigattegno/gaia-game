# Googy — Cloudflare Worker that lets the game talk to Claude.
# Deployed from GitHub by Cloudflare (Workers & Pages → Import a repository, root: googy).
# The Claude API key is a secret set in the Cloudflare dashboard: ANTHROPIC_API_KEY.
name = "googy"
main = "src/index.js"
compatibility_date = "2026-09-01"

[vars]
ALLOWED_ORIGINS = "https://omrigattegno.github.io"
FIREBASE_PROJECT_ID = "gaia-game-a32c0"

# At most 10 chat turns a minute per player.
[[ratelimits]]
name = "PER_PLAYER"
namespace_id = "1001"
simple = { limit = 10, period = 60 }

# At most 30 requests a minute from one network address (a home, a classroom), valid or not.
[[ratelimits]]
name = "PER_IP"
namespace_id = "1002"
simple = { limit = 30, period = 60 }

# At most 60 chat turns a minute from all players together: a player's sign-in is free to get,
# so this (with the spend limit in the Anthropic console) is what bounds the bill.
[[ratelimits]]
name = "EVERYONE"
namespace_id = "1003"
simple = { limit = 60, period = 60 }
