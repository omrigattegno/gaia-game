<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#c2367f">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="description" content="מי אני? משחק חברים לטלפון אחד: כולם יודעים את הסוד חוץ מאחד">
    <title>מִי אֲנִי? 🎭</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400..700&family=Varela+Round&display=swap" rel="stylesheet">
    <style>
        /* =========================================================
           WHO AM I? — a party game for one phone that goes round the circle.
           Everyone sees the same secret but one player, who must not be found out.
           One file, nothing to install: open it and play.
           ========================================================= */
        :root {
            --brand:      oklch(0.62 0.20 350);   /* the tent's magenta */
            --brand-deep: oklch(0.46 0.18 348);
            --soft:       oklch(0.97 0.025 350);
            --line:       oklch(0.88 0.07 350);
            --gold:       oklch(0.85 0.16 90);
            --ink:        oklch(0.30 0.04 300);
            --ink-soft:   oklch(0.46 0.03 300);
            --surface:    oklch(0.995 0.006 300);
            --sky-top:    oklch(0.82 0.10 300);
            --sky-bottom: oklch(0.95 0.035 340);
            --ease-out-quart: cubic-bezier(0.25, 1, 0.5, 1);
            --ease-out-quint: cubic-bezier(0.22, 1, 0.36, 1);
            --t-ui: 200ms;
        }
        * { box-sizing: border-box; }
        html { height: 100%; }
        body {
            margin: 0; min-height: 100vh; min-height: 100dvh;
            display: flex; align-items: center; justify-content: center;
            padding: max(12px, env(safe-area-inset-top)) 10px max(12px, env(safe-area-inset-bottom));
            font-family: 'Varela Round', 'Fredoka', 'Segoe UI', sans-serif; color: var(--ink);
            background: linear-gradient(180deg, var(--sky-top) 0%, var(--sky-bottom) 100%) fixed;
            user-select: none; -webkit-user-select: none; touch-action: manipulation; -webkit-tap-highlight-color: transparent;
        }

        /* --- the fairground behind the card: bunting and a few balloons --- */
        .bg { position: fixed; inset: 0; z-index: 0; pointer-events: none; overflow: hidden; }
        .bg svg { position: absolute; top: 0; left: 0; width: 100%; height: auto; }
        .bg .float { position: absolute; font-size: 2.2rem; opacity: 0.6; animation: floaty 7s ease-in-out infinite alternate; }

        /* --- the card: a coloured header with the numbers, the stage under it --- */
        .card {
            position: relative; z-index: 1; width: min(100%, 480px);
            min-height: min(580px, calc(100dvh - 24px)); max-height: calc(100dvh - 24px);
            display: flex; flex-direction: column; overflow: hidden;
            background: var(--surface); border-radius: 30px; border: 4px solid var(--brand);
            box-shadow: 0 8px 0 var(--brand-deep), 0 16px 30px oklch(0.25 0.08 330 / 0.25);
            animation: fadeIn 0.4s var(--ease-out-quart);
        }
        .hud {
            position: relative; flex: none; height: 56px; padding: 0 10px 0 100px;
            background: linear-gradient(180deg, var(--brand), var(--brand-deep));
            display: flex; justify-content: space-between; align-items: center; gap: 6px;
            font-weight: bold; color: var(--brand-deep); font-size: 1rem;
        }
        .hud > div {
            background: oklch(1 0 0 / 0.95); border-radius: 999px; padding: 5px 11px;
            box-shadow: 0 2px 0 oklch(0.2 0.06 330 / 0.22); white-space: nowrap;
            min-width: 0; overflow: hidden; text-overflow: ellipsis;
        }
        .hud > div:empty { display: none; }
        .hud .num { flex-shrink: 0; }
        .icon-btn {
            position: absolute; top: 7px; width: 42px; height: 42px; padding: 0; z-index: 2;
            display: grid; place-items: center; font-size: 1.2rem; cursor: pointer;
            background: var(--surface); border: 3px solid oklch(1 0 0 / 0.7); border-radius: 50%;
            box-shadow: 0 3px 0 oklch(0.2 0.06 330 / 0.3); transition: transform var(--t-ui) var(--ease-out-quart);
        }
        .icon-btn:active { transform: translateY(3px); }
        .icon-btn.home { left: 8px; }
        .icon-btn.sound { left: 54px; }
        .icon-btn[hidden] { display: none; }
        .body { flex: 1; min-height: 0; overflow-y: auto; -webkit-overflow-scrolling: touch; padding: 12px 14px 16px; text-align: center; }   /* min-height lets a long screen scroll inside the card */

        /* the mask that explains each step */
        .guide { display: flex; align-items: center; gap: 8px; margin: 0 0 10px; }
        .guide .mascot {
            flex-shrink: 0; width: 54px; height: 54px; display: grid; place-items: center; font-size: 2rem;
            background: var(--soft); border: 2px solid var(--line); border-radius: 50%;
        }
        .bubble {
            position: relative; flex: 1; text-align: right; font-size: 1.02rem; line-height: 1.5;
            background: var(--soft); border: 2px solid var(--line); border-radius: 16px; padding: 8px 12px;
        }
        .bubble::before {   /* the bubble's tail points at the mask */
            content: ''; position: absolute; right: -9px; top: 50%; margin-top: -7px;
            border: 7px solid transparent; border-left-color: var(--line); border-right: 0;
        }

        .stage { display: flex; flex-direction: column; align-items: center; gap: 10px; }
        .stage [hidden] { display: none !important; }
        .stage .wait { visibility: hidden; }   /* keeps its place, so nothing under the finger moves when it shows */
        .title { font-size: 1.55rem; color: var(--brand-deep); margin: 2px 0 6px; line-height: 1.3; }
        .big { font-size: 5.5rem; line-height: 1.1; filter: drop-shadow(0 5px 5px oklch(0.3 0.05 300 / 0.15)); }
        .name { font-size: 2rem; font-weight: 800; max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .line { font-size: 1.25rem; color: var(--ink-soft); margin: 0; }
        .line.small { font-size: 1rem; }

        /* the opening screen */
        .logo-mask { font-size: 5.2rem; line-height: 1.1; animation: bob 2.4s ease-in-out infinite; }
        .logo-title { font-size: 2.7rem; margin: 0; color: var(--brand-deep); line-height: 1.2; }
        .logo-sub { margin: 4px 0 10px; color: var(--ink-soft); font-size: 1.15rem; }

        /* buttons, like sweets */
        .btn {
            display: block; width: 100%; padding: 14px; margin: 6px 0 0;
            font: inherit; font-size: 1.4rem; font-weight: bold; border: none; border-radius: 50px; color: #fff;
            cursor: pointer; min-height: 56px; position: relative; overflow: hidden;
            box-shadow: 0 5px 0 oklch(0.3 0.05 330 / 0.35); text-shadow: 0 2px 0 oklch(0.2 0.05 330 / 0.22);
            transition: transform var(--t-ui) var(--ease-out-quart), box-shadow var(--t-ui) var(--ease-out-quart);
        }
        .btn:active { transform: translateY(4px); box-shadow: 0 2px 0 oklch(0.3 0.05 330 / 0.35); }
        .btn::before {   /* a shine on the top half */
            content: ''; position: absolute; left: 14px; right: 14px; top: 4px; height: 42%;
            border-radius: 999px; background: linear-gradient(oklch(1 0 0 / 0.30), oklch(1 0 0 / 0)); pointer-events: none;
        }
        .btn-main { background: linear-gradient(135deg, oklch(0.70 0.19 350), oklch(0.56 0.20 345)); }
        .btn-soft { background: linear-gradient(145deg, oklch(0.68 0.10 275), oklch(0.56 0.12 278)); }
        .btn-ghost { background: var(--surface); color: var(--brand-deep); border: 3px solid var(--line); box-shadow: 0 5px 0 var(--line); text-shadow: none; }
        .btn-ghost::before { display: none; }
        .link { border: none; background: none; color: var(--brand); text-decoration: underline; cursor: pointer; font: inherit; font-size: 1rem; padding: 8px; }

        /* tiles: a number of players, a subject, a player to vote for */
        .grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; width: 100%; }
        .grid.cols-2 { grid-template-columns: repeat(2, 1fr); }
        .grid.players { grid-template-columns: repeat(auto-fit, minmax(92px, 1fr)); }
        .tile {
            border: 3px solid var(--brand); background: var(--surface); border-radius: 20px; padding: 10px 6px 8px;
            box-shadow: 0 6px 0 var(--brand-deep); cursor: pointer; font: inherit; color: var(--ink); min-width: 0;
            transition: transform var(--t-ui) var(--ease-out-quint), box-shadow var(--t-ui) var(--ease-out-quint);
        }
        .tile:active { transform: translateY(4px); box-shadow: 0 2px 0 var(--brand-deep); }
        .tile .t-emoji { display: block; font-size: 2.6rem; line-height: 1.15; font-family: 'Fredoka', sans-serif; font-weight: 700; }
        .tile .t-label { display: block; font-size: 1.05rem; font-weight: 700; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .tile.picked { border-color: var(--gold); background: oklch(0.98 0.04 95); box-shadow: 0 6px 0 oklch(0.72 0.15 80); }

        /* the how-to-play rows */
        .step { display: flex; align-items: center; gap: 12px; width: 100%; text-align: right;
            background: var(--soft); border: 2px solid var(--line); border-radius: 18px; padding: 8px 12px; font-size: 1.12rem; line-height: 1.4; }
        .step .s-emoji { font-size: 2.2rem; flex-shrink: 0; }

        /* names */
        .name-row { display: flex; gap: 8px; align-items: center; width: 100%; }
        .name-input { flex: 1; min-width: 0; padding: 10px; font: inherit; font-size: 1.2rem; border-radius: 12px; border: 2px solid var(--line); text-align: center; background: var(--surface); color: var(--ink); }
        .name-input:focus { outline: 3px solid var(--gold); outline-offset: 1px; }
        .avatar { width: 50px; height: 50px; flex-shrink: 0; border-radius: 50%; border: 3px solid var(--line); background: var(--surface); font-size: 1.7rem; cursor: pointer; box-shadow: 0 3px 0 var(--brand-deep); padding: 0; }

        /* who has spoken this round */
        .order { display: flex; justify-content: center; gap: 6px; flex-wrap: wrap; }
        .order span { width: 38px; height: 38px; border-radius: 50%; display: grid; place-items: center; font-size: 1.3rem; background: var(--surface); border: 2px solid var(--line); opacity: 0.4; }
        .order span.done { opacity: 1; }
        .order span.now { opacity: 1; outline: 3px solid var(--gold); outline-offset: 2px; }
        .order.many { gap: 4px; }   /* eight chips still fit one row on a phone */
        .order.many span { width: 32px; height: 32px; font-size: 1.1rem; }

        /* the secret card: shows its face only while a finger holds it. A fixed height, so the
           guesser's card can never grow and give them away from across the table */
        .secret-card {
            width: min(100%, 320px); height: 230px; border-radius: 26px; padding: 16px; display: grid; place-items: center; text-align: center;
            background: linear-gradient(160deg, var(--brand), var(--brand-deep)); color: #fff; border: 3px solid var(--brand-deep);
            box-shadow: 0 8px 0 var(--brand-deep), 0 14px 26px oklch(0.25 0.08 330 / 0.25); cursor: pointer;
            user-select: none; -webkit-user-select: none; -webkit-touch-callout: none; touch-action: none; -webkit-tap-highlight-color: transparent;
        }
        .secret-card.open { background: var(--surface); color: var(--ink); border-color: var(--brand); }
        .secret-card .c-closed { font-size: 1.3rem; font-weight: 700; }
        .secret-card .c-closed .c-mask { display: block; font-size: 4rem; line-height: 1.1; }
        .secret-card .c-emoji { font-size: 5.5rem; line-height: 1.1; }
        .secret-card .c-word { font-size: 2.2rem; font-weight: 800; line-height: 1.3; }
        .secret-card .c-small { font-size: 1.05rem; color: var(--ink-soft); text-wrap: balance; }
        @media (max-width: 380px) { .secret-card .c-small { font-size: 0.95rem; } }

        /* the imposter's four guesses */
        .opts { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; width: 100%; }
        .opt { position: relative; cursor: pointer; font: inherit; font-weight: bold; padding: 10px 6px; border-radius: 20px;
            background: var(--surface); border: 3px solid var(--brand); color: var(--ink); box-shadow: 0 6px 0 var(--brand-deep);
            transition: transform var(--t-ui) var(--ease-out-quint), box-shadow var(--t-ui) var(--ease-out-quint), background var(--t-ui); }
        .opt:not(:disabled):active { transform: translateY(4px); box-shadow: 0 2px 0 var(--brand-deep); }
        .opt:disabled { cursor: default; }
        .opt .o-emoji { display: block; font-size: 3rem; line-height: 1.15; }
        .opt .o-word { display: block; font-size: 1.1rem; }
        .opt.correct { background: oklch(0.95 0.07 150); border-color: oklch(0.60 0.15 150); color: oklch(0.38 0.12 150); box-shadow: 0 6px 0 oklch(0.48 0.13 150); }
        .opt.wrong   { background: oklch(0.95 0.04 25);  border-color: oklch(0.62 0.19 25);  color: oklch(0.48 0.18 25);  box-shadow: 0 6px 0 oklch(0.48 0.17 25); }
        .drum { animation: bounce 0.5s infinite; }

        /* the scoreboard */
        .score { width: 100%; display: flex; flex-direction: column; gap: 6px; }
        .score-head { font-size: 1.15rem; font-weight: 700; color: var(--brand-deep); margin: 4px 0 0; }
        .score-row { display: flex; align-items: center; gap: 8px; background: var(--soft); border: 2px solid var(--line); border-radius: 14px; padding: 6px 10px; font-size: 1.05rem; }
        .score-row.lead { border-color: var(--gold); background: oklch(0.98 0.04 95); }
        .score-row .s-av { font-size: 1.5rem; line-height: 1; }
        .score-row .s-name { flex: 1; text-align: right; font-weight: 700; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .score-row .s-gain { color: oklch(0.45 0.15 150); font-weight: 700; font-family: 'Fredoka', sans-serif; }
        .score-row .s-pts { font-family: 'Fredoka', sans-serif; font-weight: 700; font-size: 1.25rem; min-width: 2ch; text-align: center; }

        /* over the whole card: the end of a round */
        .end { position: absolute; inset: 0; z-index: 20; display: grid; place-items: center; padding: 12px; background: oklch(0.2 0.04 350 / 0.45); }
        .end[hidden] { display: none; }
        .end-box { position: relative; overflow: hidden; isolation: isolate; background: var(--surface); border-radius: 22px; padding: 14px 12px; text-align: center;
            box-shadow: 0 10px 30px oklch(0.2 0.05 300 / 0.35); animation: popIn 0.35s var(--ease-out-quart); width: min(96%, 380px); max-height: 100%; overflow-y: auto; }
        .end-icon { font-size: 3.4rem; line-height: 1.1; }
        .end-box h2 { margin: 4px 0; font-size: 1.5rem; color: var(--brand-deep); }
        .end-line { margin: 0 0 4px; color: var(--ink-soft); line-height: 1.4; }
        .end-line .big { font-size: 2.2rem; vertical-align: middle; filter: none; }
        .end-actions { display: flex; gap: 8px; justify-content: center; }
        .end-actions .btn { margin: 8px 0 0; padding: 12px 10px; font-size: 1.1rem; flex: 1; white-space: nowrap; }
        .confetti { position: absolute; inset: 0; z-index: -1; pointer-events: none; overflow: hidden; }
        .confetti i { position: absolute; top: -24px; width: 9px; height: 15px; border-radius: 2px; animation: confetti-fall 3.4s linear infinite; }
        .confetti i:nth-child(1)  { left: 5%;  background: #EF5350; animation-delay: -0.3s; animation-duration: 3.1s; }
        .confetti i:nth-child(2)  { left: 14%; background: #FFCA28; animation-delay: -1.9s; }
        .confetti i:nth-child(3)  { left: 23%; background: #42A5F5; animation-delay: -1.1s; animation-duration: 3.8s; }
        .confetti i:nth-child(4)  { left: 32%; background: #66BB6A; animation-delay: -2.6s; }
        .confetti i:nth-child(5)  { left: 41%; background: #AB47BC; animation-delay: -0.7s; animation-duration: 3s; }
        .confetti i:nth-child(6)  { left: 50%; background: #FF7EB3; animation-delay: -2.2s; animation-duration: 3.6s; }
        .confetti i:nth-child(7)  { left: 59%; background: #FFA726; animation-delay: -1.5s; }
        .confetti i:nth-child(8)  { left: 68%; background: #26C6DA; animation-delay: -0.1s; animation-duration: 3.9s; }
        .confetti i:nth-child(9)  { left: 77%; background: #EF5350; animation-delay: -2.9s; animation-duration: 3.2s; }
        .confetti i:nth-child(10) { left: 86%; background: #FFCA28; animation-delay: -1.3s; }
        .confetti i:nth-child(11) { left: 94%; background: #66BB6A; animation-delay: -0.5s; animation-duration: 3.7s; }
        .confetti i:nth-child(12) { left: 46%; background: #42A5F5; animation-delay: -3.2s; animation-duration: 3.3s; }
        .star-particle { position: fixed; pointer-events: none; z-index: 999; font-size: 1.5rem; animation: starFly 0.7s var(--ease-out-quart) forwards; }

        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        @keyframes popIn { from { opacity: 0; transform: scale(0.85); } to { opacity: 1; transform: scale(1); } }
        @keyframes bounce { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-10px); } }
        @keyframes bob { 0%, 100% { transform: translateY(0) rotate(-4deg); } 50% { transform: translateY(-8px) rotate(4deg); } }
        @keyframes floaty { from { transform: translateY(0); } to { transform: translateY(-26px); } }
        @keyframes starFly { 0% { opacity: 1; transform: translate(0, 0) scale(0.5); } 100% { opacity: 0; transform: translate(var(--dx), var(--dy)) scale(1.3); } }
        @keyframes confetti-fall { 0% { transform: translateY(0) rotate(0deg); opacity: 1; } 100% { transform: translateY(640px) rotate(560deg); opacity: 0.6; } }

        @media (max-width: 380px) {
            .hud { font-size: 0.9rem; gap: 4px; padding-right: 8px; }
            .hud > div { padding: 4px 8px; }
            .body { padding: 10px 10px 14px; }
        }
        @media (prefers-reduced-motion: reduce) {
            *, *::before, *::after { animation: none !important; transition: none !important; }
        }
    </style>
</head>
<body>
    <div class="bg" id="bg" aria-hidden="true"></div>

    <main class="card" id="card">
        <header class="hud">
            <button class="icon-btn home" id="home-btn" type="button" aria-label="לַתַּפְרִיט הָרָאשִׁי" hidden>🏠</button>
            <button class="icon-btn sound" id="sound-btn" type="button" aria-label="צְלִילִים">🔊</button>
            <div id="pill-phase"></div>
            <div id="pill-count" class="num"></div>
        </header>
        <div class="body">
            <div class="guide"><span class="mascot" aria-hidden="true">🎭</span><div class="bubble" id="bubble" aria-live="polite"></div></div>
            <div id="stage" class="stage"></div>
        </div>
        <div id="end" class="end" hidden></div>
    </main>

<script>
// ===== WHO AM I? =====
// A party game for 3-8 players on one phone. Everyone is shown the same secret (an animal, a
// food...) except one player, who is told only that they are "the guesser" and must not let on.
// The phone goes round: each player says one word about the secret, the group votes on who
// does not know, and the guesser gets one guess at the secret. Points add up over the rounds.
// No DOM is built with names in HTML strings: a player's name goes in with textContent only,
// and the secret is built on pointerdown and torn down on release, so it never sits in the
// page waiting to be seen. The secret word is never handed to the voice: the phone talks only
// about whose turn it is.
(function () {
    'use strict';
    const $ = id => document.getElementById(id);
    const HOLD_MS = 400;   // a tap this short has not really shown the card
    const ARM_MS = 400;    // how long a fresh screen ignores taps (see armLater)
    const STORE = 'whoami.v1';
    const MID_ROUND = ['pass', 'secret', 'ready', 'hint', 'hint-more', 'vote', 'vote-reveal', 'guess'];

    // faces and disguises only, so an avatar can never be mistaken for a secret
    const AVATARS = ['😎', '🤠', '🥳', '🤓', '🧐', '🥸', '🤩', '😇', '🤪', '😜', '👽', '👾'];
    const CATEGORIES = {
        animals: { label: 'חַיּוֹת', emoji: '🐾', items: [
            { e: '🐶', w: 'כֶּלֶב' }, { e: '🐱', w: 'חָתוּל' }, { e: '🐘', w: 'פִּיל' }, { e: '🦒', w: 'גִ\'ירָפָה' }, { e: '🦁', w: 'אַרְיֵה' }, { e: '🐵', w: 'קוֹף' },
            { e: '🐸', w: 'צְפַרְדֵּעַ' }, { e: '🐢', w: 'צָב' }, { e: '🐰', w: 'אַרְנָב' }, { e: '🐧', w: 'פִּינְגְּוִין' }, { e: '🐬', w: 'דּוֹלְפִין' }, { e: '🦋', w: 'פַּרְפַּר' },
            { e: '🐝', w: 'דְּבוֹרָה' }, { e: '🐍', w: 'נָחָשׁ' }, { e: '🦓', w: 'זֶבְּרָה' }, { e: '🐄', w: 'פָּרָה' }
        ] },
        foods: { label: 'אֹכֶל', emoji: '🍕', items: [

    const CAT_ORDER = ['animals', 'foods', 'jobs', 'tales', 'objects', 'places', 'sports', 'vehicles'];

    // ---- timers: everything a screen schedules is dropped when the screen changes ----

    }
    function clearLater() { pending.forEach(clearTimeout); pending.clear(); }

    // ---- what the phone remembers between visits: the last table, the sound switch ----
    function load() {
        try { const o = JSON.parse(localStorage.getItem(STORE)); return o && typeof o === 'object' ? o : {}; } catch (e) { return {}; }
    }
    function save(patch) {
        try { localStorage.setItem(STORE, JSON.stringify(Object.assign(load(), patch))); } catch (e) {}
    }

    // ---- sounds (Web Audio) and the voice that calls the turns ----
    let audioCtx = null;
    let soundOn = load().sound !== false;
    function initAudio() {
        if (!audioCtx) {
            try { audioCtx = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { audioCtx = null; }
        }
        // iOS suspends the context when the app goes to the background; the next tap brings it back
        if (audioCtx && audioCtx.state !== 'running' && audioCtx.resume) audioCtx.resume().catch(() => {});
    }
    function playNote(freq, startTime, duration, waveType, gainVal) {
        if (!audioCtx) return;
        try {
            const osc = audioCtx.createOscillator(), gain = audioCtx.createGain();
            osc.connect(gain); gain.connect(audioCtx.destination);
            osc.type = waveType;
            osc.frequency.setValueAtTime(freq, startTime);
            gain.gain.setValueAtTime(gainVal, startTime);
            gain.gain.exponentialRampToValueAtTime(0.001, startTime + duration);
            osc.start(startTime);
            osc.stop(startTime + duration + 0.05);
        } catch (e) {}
    }
    function playSound(type) {
        if (!soundOn) return;
        initAudio();
        if (!audioCtx) return;
        const now = audioCtx.currentTime;
        if (type === 'correct') {
            playNote(523.25, now, 0.1, 'sine', 0.4); playNote(659.25, now + 0.1, 0.1, 'sine', 0.4); playNote(784, now + 0.2, 0.15, 'sine', 0.4);
        } else if (type === 'wrong') {
            playNote(466.16, now, 0.15, 'sawtooth', 0.12); playNote(392, now + 0.15, 0.15, 'sawtooth', 0.12);
        } else if (type === 'victory') {
            playNote(523.25, now, 0.12, 'sine', 0.4); playNote(659.25, now + 0.12, 0.12, 'sine', 0.4);
            playNote(784, now + 0.24, 0.12, 'sine', 0.4); playNote(1046.5, now + 0.36, 0.25, 'sine', 0.5);
        } else if (type === 'drum') {
            for (let k = 0; k < 12; k++) playNote(180 + (k % 2) * 40, now + k * 0.09, 0.06, 'square', 0.12);
        }

        voices = speechSynthesis.getVoices();
        speechSynthesis.onvoiceschanged = () => { voices = speechSynthesis.getVoices(); };
    }
    function say(text) {
        if (!soundOn || !window.speechSynthesis) return;
        try {
            speechSynthesis.cancel();

            utt.rate = 0.9; utt.lang = 'he-IL';

            if (he) utt.voice = he;
            setTimeout(() => speechSynthesis.speak(utt), 30);
        } catch (e) {}
    }

    // a burst of stars from a point (or from the middle of the card)
    function spawnStars(event) {
        let x, y;
        if (event && event.clientX !== undefined) { x = event.clientX; y = event.clientY; }
        else { const r = $('card').getBoundingClientRect(); x = r.left + r.width / 2; y = r.top + r.height / 2; }
        const emojis = ['⭐', '🌟', '✨', '💫'];
        for (let i = 0; i < 8; i++) {
            const star = document.createElement('div');
            star.className = 'star-particle';
            const angle = (i / 8) * Math.PI * 2, spread = 80 + Math.random() * 40;
            star.style.setProperty('--dx', Math.cos(angle) * spread + 'px');
            star.style.setProperty('--dy', Math.sin(angle) * spread + 'px');
            star.style.left = x + 'px'; star.style.top = y + 'px';
            star.textContent = emojis[Math.floor(Math.random() * emojis.length)];
            document.body.appendChild(star);
            setTimeout(() => star.remove(), 700);
        }
    }
    function shuffle(arr) {
        const a = arr.slice();
        for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; }
        return a;
    }

    function fresh() {
        return {
            phase: 'home', n: 0, cat: null, players: [], scores: [], roundNo: 0, gained: [],
            secret: null, imposter: -1, lastImposter: -1,
            used: {},            // catKey -> Set of words already used this sitting
            i: 0,                // whose turn it is to see the card
            order: [], round: 1, turn: 0, voted: -1, guessed: null, seen: false, roundsPlayed: 0,
            resume: null,        // a round left by 🏠 waits here
            last: { n: 4, cat: 'animals', names: [], avatars: [] }
        };
    }
    const G = fresh();
    (function () {
        const l = load().last;
        if (!l || typeof l !== 'object') return;
        if (l.n >= 3 && l.n <= 8) G.last.n = l.n;
        if (CATEGORIES[l.cat]) G.last.cat = l.cat;
        if (Array.isArray(l.names) && Array.isArray(l.avatars) && l.names.length === l.avatars.length &&

            G.last.names = l.names; G.last.avatars = l.avatars;

    // ---- small builders: nothing here takes HTML, every string goes in as text ----
    function pills(phase, count) { $('pill-phase').textContent = phase; $('pill-count').textContent = count || ''; }

    // A screen that replaces the one under the finger stays deaf for a short beat, so a quick
    // double tap on the last button cannot also press whatever now sits in the same spot.
    function armLater(btns) {

    }
    function detachCard() {
        if (cardClose) document.removeEventListener('visibilitychange', cardClose);

    }
    // the table's points, best first; gained[k] (if given) shows what this round added
    function scoreboard(gained) {
        const box = node('div', 'score');
        box.appendChild(node('div', 'score-head', '🏆 הַנִּקּוּד אַחֲרֵי ' + (G.roundNo === 1 ? 'סִבּוּב אֶחָד' : G.roundNo + ' סִבּוּבִים')));
        const top = Math.max.apply(null, G.scores);
        G.players.map((p, k) => ({ p, k, pts: G.scores[k] }))
            .sort((a, b) => b.pts - a.pts || a.k - b.k)
            .forEach(function (r) {
                const row = node('div', 'score-row' + (r.pts === top && top > 0 ? ' lead' : ''));
                row.appendChild(node('span', 's-av', r.p.avatar));
                row.appendChild(node('span', 's-name', r.p.name + (r.pts === top && top > 0 ? ' 👑' : '')));
                if (gained && gained[r.k] > 0) row.appendChild(node('span', 's-gain', '+' + gained[r.k]));
                row.appendChild(node('span', 's-pts', String(r.pts)));
                box.appendChild(row);
            });
        return box;
    }

    // ---- the round's rules ----
    function newRound() {
        const items = CATEGORIES[G.cat].items;
        if (!G.used[G.cat]) G.used[G.cat] = new Set();
        const used = G.used[G.cat];
        if (used.size >= items.length) {
            // every secret was shown: start the pile again, but not with the one just played
            used.clear();
            if (G.secret && items.some(x => x.w === G.secret.w)) used.add(G.secret.w);
        }
        const left = items.filter(x => !used.has(x.w));
        G.secret = left[Math.floor(Math.random() * left.length)];
        used.add(G.secret.w);
        // a new guesser, never the same player twice in a row (3+ players leave at least two to pick from)
        const cands = [];
        for (let k = 0; k < G.n; k++) if (k !== G.lastImposter) cands.push(k);
        G.imposter = cands[Math.floor(Math.random() * cands.length)];
        G.lastImposter = G.imposter;
        // who speaks first is luck of the draw; the guesser is in the ring like everyone else
        const start = Math.floor(Math.random() * G.n);
        G.order = [];
        for (let k = 0; k < G.n; k++) G.order.push((start + k) % G.n);
        G.i = 0; G.round = 1; G.turn = 0; G.voted = -1; G.guessed = null; G.seen = false; G.roundsPlayed = 0; G.resume = null;
    }
    // the right answer and three others from the same subject, in a random order
    function pickOptions(items, secret) {
        const others = shuffle(items.filter(x => x.w !== secret.w)).slice(0, 3);
        return shuffle([secret].concat(others));
    }
    // round 2 starts half a circle away, so the same player is not first twice
    function speaker(k) {
        const shift = G.round === 2 ? Math.floor(G.n / 2) : 0;
        return G.players[G.order[(k + shift) % G.n]];
    }

    // ---- the screens ----
    function render(phase) {
        detachCard();

        end.hidden = true; end.textContent = '';

    function setupNames() {
        pills('🎭 מִי אֲנִי?');
        guide('אֶפְשָׁר לִכְתֹּב שֵׁמוֹת — וְאֶפְשָׁר פָּשׁוּט לְהַתְחִיל!');
        const s = stage();
        s.appendChild(title('מִי מְשַׂחֵק? ✏️'));
        // the table from the last game, or the one being played, fills the boxes
        const prev = G.players.length === G.n ? G.players : G.last.names.length === G.n ? G.last.names.map((nm, k) => ({ name: nm, avatar: G.last.avatars[k] })) : null;
        const draft = [];
        for (let k = 0; k < G.n; k++) draft.push({ name: prev ? prev[k].name : '', avatar: prev ? prev[k].avatar : AVATARS[k] });
        const inputs = [], avBtns = [];
        draft.forEach(function (p, k) {
            const row = node('div', 'name-row');
            const av = node('button', 'avatar', p.avatar);
            av.type = 'button';
            av.setAttribute('aria-label', 'לְהַחֲלִיף סֵמֶל');
            av.addEventListener('click', function () {
                // the next face no one else at the table is wearing
                const taken = draft.filter((q, j) => j !== k).map(q => q.avatar);
                let idx = AVATARS.indexOf(p.avatar);
                for (let step = 0; step < AVATARS.length; step++) {
                    idx = (idx + 1) % AVATARS.length;
                    if (taken.indexOf(AVATARS[idx]) < 0) break;
                }
                p.avatar = AVATARS[idx];
                av.textContent = p.avatar;
            });
            const inp = node('input', 'name-input');
            inp.type = 'text'; inp.maxLength = 20; inp.autocomplete = 'off'; inp.dir = 'rtl'; inp.enterKeyHint = 'next';
            // the default name is only a hint in the box, so a player can just type their own
            const def = 'שַׂחְקָן ' + (k + 1);
            inp.placeholder = def;
            inp.value = p.name && p.name !== def ? p.name : '';
            inp.addEventListener('focus', () => inp.select());
            inp.setAttribute('aria-label', 'שֵׁם שַׂחְקָן ' + (k + 1));
            inp.addEventListener('keydown', function (e) {
                if (e.key !== 'Enter') return;
                e.preventDefault();
                if (inputs[k + 1]) inputs[k + 1].focus(); else inp.blur();
            });
            row.appendChild(av); row.appendChild(inp);
            inputs.push(inp); avBtns.push(av);
            s.appendChild(row);
        });
        const startBtn = bigBtn('btn-main', 'מַתְחִילִים! ▶️', function () {
            const before = G.players.map(p => p.name).join('\n');
            const taken = {};
            G.players = draft.map(function (p, k) {
                let name = (inputs[k].value || '').trim() || 'שַׂחְקָן ' + (k + 1);
                // two players with one name: the second becomes "name 2", the third "name 3"
                const base = name;
                for (let c = 2; taken[name]; c++) name = base + ' ' + c;
                taken[name] = true;
                return { name: name, avatar: p.avatar };
            });
            // the same table keeps its points; a new one starts from zero
            if (G.players.map(p => p.name).join('\n') !== before || G.scores.length !== G.n) {
                G.scores = G.players.map(() => 0);
                G.roundNo = 0;
                G.lastImposter = -1;
            }
            G.last = { n: G.n, cat: G.cat, names: G.players.map(p => p.name), avatars: G.players.map(p => p.avatar) };
            save({ last: G.last });
            newRound();
            render('pass');
        });
        s.appendChild(startBtn);
        armLater(avBtns.concat([startBtn]));   // a double tap on a subject tile must not start the game or change a face
    }

    // The only screen that shows the secret, and only while the card is held down. The face is
    // built on press and removed on release; both faces have the same three slots, so from
    // across the table the guesser's card looks like everyone else's.
    function secret() {
        hush();
        pills('🤫 הַסּוֹד', '👤 ' + (G.i + 1) + '/' + G.n);
        guide(SECRET_GUIDE);
        const s = stage();
        const card = node('div', 'secret-card');
        card.tabIndex = 0; card.setAttribute('role', 'button'); card.setAttribute('aria-label', 'כַּרְטִיס הַסּוֹד');
        const seenBtn = bigBtn('btn-main', 'רָאִיתִי! ✅', function () {
            G.i++;
            render(G.i < G.n ? 'pass' : 'ready');
        });
        seenBtn.classList.add('wait');
        s.appendChild(card);
        s.appendChild(seenBtn);

        function buildClosed() {
            card.textContent = '';
            const c = node('div', 'c-closed');
            c.appendChild(node('span', 'c-mask', '🎭'));
            c.appendChild(document.createTextNode('לִלְחֹץ וּלְהַחֲזִיק 👇'));
            card.appendChild(c);
        }
        function buildFace(imposter) {
            card.textContent = '';
            const f = node('div', 'c-open');
            if (imposter) {
                f.appendChild(node('div', 'c-emoji', '🕵️'));
                f.appendChild(node('div', 'c-word', 'אַתֶּם הַמְּנַחֵשׁ!'));   // short enough for one line, like every secret word
                f.appendChild(node('div', 'c-small', 'הַנּוֹשֵׂא: ' + CATEGORIES[G.cat].label + '. תַּעֲמִידוּ פָּנִים!'));
            } else {
                f.appendChild(node('div', 'c-emoji', G.secret.e));
                f.appendChild(node('div', 'c-word', G.secret.w));
                f.appendChild(node('div', 'c-small', 'זֶה הַסּוֹד! לֹא מְגַלִּים 🤫'));
            }
            card.appendChild(f);
        }
        buildClosed();

        // each player gets the 'hold longer' help, and a stray tap from the screen before cannot open the card
        let downAt = 0, seen = false, armed = false;
        later(() => { armed = true; }, ARM_MS);
        const open = function () {
            if (!armed || card.classList.contains('open')) return;
            downAt = Date.now();
            card.classList.add('open');
            buildFace(G.i === G.imposter);
        };
        const closeCard = function () {
            if (!card.classList.contains('open')) return;
            card.classList.remove('open');
            buildClosed();
            if (Date.now() - downAt >= HOLD_MS) {
                seen = G.seen = true;
                seenBtn.classList.remove('wait');
                guide(SECRET_GUIDE);
            } else if (!seen) {
                guide('לְהַחֲזִיק עוֹד קְצָת ⏳');
            }
        };
        card.addEventListener('pointerdown', function (e) {
            e.preventDefault();
            try { if (card.setPointerCapture) card.setPointerCapture(e.pointerId); } catch (err) {}
            open();
        });
        ['pointerup', 'pointercancel', 'lostpointercapture'].forEach(ev => card.addEventListener(ev, closeCard));
        card.addEventListener('keydown', function (e) {
            if ((e.key === ' ' || e.key === 'Enter') && !e.repeat) { e.preventDefault(); open(); }
        });
        card.addEventListener('keyup', closeCard);
        card.addEventListener('contextmenu', e => e.preventDefault());
        // the phone put down or an app switched to: the card closes by itself
        cardClose = closeCard;
        document.addEventListener('visibilitychange', cardClose);
    }

    // one decision for the whole group: tap a player, then confirm, so a stray tap ends nothing
    function vote() {
        pills('🗳️ הַצְבָּעָה');
        guide('דַּבְּרוּ בֵּינֵיכֶם, וְאָז לַחֲצוּ יַחַד עַל הֶחָשׁוּד');

        let pick = -1;
        const confirm = bigBtn('btn-main', '✅', function () {   // a stand-in line, so the button is its real height while it waits

            G.voted = pick;
            render('vote-reveal');
        });
        confirm.classList.add('wait');
        const tiles = G.players.map(function (p, k) {
            const t = tile(p.avatar, p.name, function () {
                pick = k;

            return t;

    function guess() {
        const imp = G.players[G.imposter];
        pills('🎭 הַנִּחוּשׁ');
        guide('נִחוּשׁ אֶחָד בִּלְבַד. בְּהַצְלָחָה! 🍀');
        const s = stage();
        s.appendChild(title(imp.name + ', מַה הָיָה הַסּוֹד? 🤔'));
        s.appendChild(node('p', 'line small', 'מַעֲבִירִים אֶת הַטֶּלֶפוֹן אֶל ' + imp.name + ' 📱'));
        const grid = node('div', 'opts');
        const opts = pickOptions(CATEGORIES[G.cat].items, G.secret);
        const btns = opts.map(function (o) {
            const b = node('button', 'opt');
            b.type = 'button';
            b.appendChild(node('span', 'o-emoji', o.e));
            b.appendChild(node('span', 'o-word', o.w));
            b.addEventListener('click', function () {
                if (G.guessed !== null) return;
                const right = o.w === G.secret.w;
                G.guessed = right;
                btns.forEach(function (x, j) {
                    x.disabled = true;
                    if (opts[j].w === G.secret.w) x.classList.add('correct');
                    else if (x === b) x.classList.add('wrong');
                });
                playSound(right ? 'correct' : 'wrong');
                later(showResult, 1100);
            });
            grid.appendChild(b);
            return b;
        });
        s.appendChild(grid);
        armLater(btns);   // the 'הַלְאָה' tap that brought us here must not choose for the guesser
        say('מַה הָיָה הַסּוֹד?');
    }

    // ---- the end of a round: who won, the points, and on to the next one ----
    function showResult() {
        if (G.phase !== 'guess') return;
        G.phase = 'result';
        G.resume = null;
        const imp = G.players[G.imposter], caught = G.voted === G.imposter, guessed = !!G.guessed;
        const groupWon = caught && !guessed;
        // caught: a point to everyone else; not caught: two to the guesser; the secret guessed: one more
        const gained = G.players.map(() => 0);
        if (caught) G.players.forEach((p, k) => { if (k !== G.imposter) gained[k] += 1; });
        else gained[G.imposter] += 2;
        if (guessed) gained[G.imposter] += 1;
        G.scores = G.scores.map((v, k) => v + gained[k]);
        G.gained = gained;
        G.roundNo++;
        pills('🏁 סִבּוּב ' + G.roundNo);

        const titleText = groupWon ? 'הַקְּבוּצָה נִצְּחָה! 🏆' : 'הַנִּצָּחוֹן שֶׁל ' + imp.name + '! 🎭';
        let line;
        if (groupWon) line = 'תְּפַסְתֶּם אֶת הַמְּנַחֵשׁ, וְהוּא לֹא נִחֵשׁ אֶת הַסּוֹד';
        else if (caught) line = 'הַמְּנַחֵשׁ נִתְפַּס — אֲבָל נִחֵשׁ אֶת הַסּוֹד!';
        else line = 'אַף אֶחָד לֹא תָּפַס אֶת הַמְּנַחֵשׁ!' + (guessed ? ' וְגַם נִחֵשׁ אֶת הַסּוֹד! 🌟' : '');

        const end = $('end');
        end.textContent = '';
        const box = node('div', 'end-box');
        const confetti = node('div', 'confetti');
        confetti.setAttribute('aria-hidden', 'true');
        for (let k = 0; k < 12; k++) confetti.appendChild(document.createElement('i'));
        box.appendChild(confetti);
        box.appendChild(node('div', 'end-icon', groupWon ? '🏆' : '🎭'));
        box.appendChild(node('h2', null, titleText));
        box.appendChild(node('p', 'end-line', line));
        const l1 = node('p', 'end-line', 'הַסּוֹד הָיָה: ');
        l1.appendChild(node('span', 'big', G.secret.e));
        l1.appendChild(document.createTextNode(' ' + G.secret.w));
        box.appendChild(l1);
        box.appendChild(node('p', 'end-line', 'הַמְּנַחֵשׁ: ' + imp.avatar + ' ' + imp.name));
        box.appendChild(scoreboard(gained));
        const actions = node('div', 'end-actions');
        const again = bigBtn('btn-main', 'עוֹד סִבּוּב 🔁', function () {
            // the same players and subject, a new secret and a new guesser
            newRound();
            render('pass');
        });
        const menu = bigBtn('btn-soft', 'לַתַּפְרִיט 🏠', () => render('home'));
        actions.appendChild(again);
        actions.appendChild(menu);
        box.appendChild(actions);
        const link = node('button', 'link', 'לְשַׁנּוֹת שַׂחְקָנִים אוֹ נוֹשֵׂא ⚙️');
        link.type = 'button';
        link.addEventListener('click', () => render('setup-count'));
        box.appendChild(link);
        end.appendChild(box);
        end.hidden = false;
        armLater([again, menu, link]);   // the guess's tap must not start the next round

        playSound('victory');
        const bursts = groupWon ? 5 : 3;
        for (let k = 0; k < bursts; k++) later(() => spawnStars({ clientX: Math.random() * innerWidth, clientY: Math.random() * innerHeight * 0.6 }), k * 200);
        say(groupWon ? 'הַקְּבוּצָה נִצְּחָה!' : 'הַנִּצָּחוֹן שֶׁל ' + imp.name + '!');   // no emoji: the voice would read its name
    }

    // 🏠 in the middle of a round: the round waits on the menu until 'continue' or a new one
    function goHome() {
        if (MID_ROUND.indexOf(G.phase) >= 0) G.resume = G.phase;
        hush();
        render('home');
    }

    const VIEWS = { home: home, how: how, 'setup-count': setupCount, 'setup-cat': setupCat, 'setup-names': setupNames, pass: pass, secret: secret,
        ready: ready, hint: hint, 'hint-more': hintMore, vote: vote, 'vote-reveal': voteReveal, guess: guess };

    // ---- the fairground behind the card ----
    function decorate() {
        const colours = ['#FF7EB3', '#FFCA28', '#42A5F5', '#66BB6A', '#AB47BC', '#FFA726'];
        let flags = '';
        for (let k = 0; k < 16; k++) {
            const x = k * 76 + 2, dip = 10 + Math.sin(k / 15 * Math.PI) * 26;
            flags += '<polygon points="' + x + ',' + dip + ' ' + (x + 72) + ',' + dip + ' ' + (x + 36) + ',' + (dip + 58) + '" fill="' + colours[k % colours.length] + '"/>';
        }
        const bg = $('bg');
        bg.innerHTML = '<svg viewBox="0 0 1220 100" preserveAspectRatio="none" style="height:11vh;max-height:90px">' +
            '<path d="M0 12 Q610 56 1220 12" fill="none" stroke="oklch(0.45 0.08 60)" stroke-width="4"/>' + flags + '</svg>';
        [['🎈', '4%', '22%', '0s'], ['🎉', '88%', '18%', '-3s'], ['🎈', '92%', '64%', '-5s'], ['🎊', '6%', '72%', '-2s']].forEach(function (f) {
            const sp = node('span', 'float', f[0]);
            sp.style.left = f[1]; sp.style.top = f[2]; sp.style.animationDelay = f[3];
            bg.appendChild(sp);
        });
    }

    // ---- start ----
    decorate();
    setSound(soundOn);
    $('home-btn').addEventListener('click', goHome);
    $('sound-btn').addEventListener('click', function () { initAudio(); setSound(!soundOn); });
    document.addEventListener('pointerdown', function warm() { initAudio(); document.removeEventListener('pointerdown', warm); }, { once: true });
    render('home');

    // for the tests
    window.WhoAmI = {
        get state() { return G; }, CATEGORIES, AVATARS, pickOptions, newRound, render,
        force(o) { Object.assign(G, o); }
    };
})();
</script>
</body>
</html>
